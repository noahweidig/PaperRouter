name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the xpi to (e.g. v0.3.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep '"version"' PaperRouter/manifest.json | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != manifest v$V"; exit 1; }
      - run: bash scripts/build-xpi.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: dist/*.xpi
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          V=${TAG#v}
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/paperrouter-$V.xpi" --clobber
          else
            gh release create "$TAG" "dist/paperrouter-$V.xpi" --title "$TAG" --generate-notes
          fi
