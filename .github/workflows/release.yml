name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.0). Created on this branch tip if it does not exist; xpi is attached either way.'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag and check it matches the manifest version
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$INPUT_TAG"
          [ -n "$TAG" ] || { [ "${GITHUB_REF_TYPE}" = "tag" ] && TAG="${GITHUB_REF_NAME}"; } || true
          V=$(grep '"version"' PaperRouter/manifest.json | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          if [ -z "$TAG" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if gh release view "v$V" >/dev/null 2>&1; then echo "v$V already released"; else TAG="v$V"; fi
          fi
          case "$TAG" in ''|v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "invalid tag: $TAG"; exit 1 ;; esac
          if [ -n "$TAG" ] && [ "v$V" != "$TAG" ]; then echo "tag $TAG != manifest v$V"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: bash scripts/build-xpi.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: dist/*.xpi
      - name: Publish release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          V: ${{ steps.tag.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/paperrouter-$V.xpi" --clobber
          else
            gh release create "$TAG" "dist/paperrouter-$V.xpi" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
