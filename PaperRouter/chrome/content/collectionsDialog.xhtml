<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://tidy-up-trae/content/collectionsDialog.css" type="text/css"?>
<window
    xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    xmlns:html="http://www.w3.org/1999/xhtml"
    id="tidy-up-collections-dialog"
    title=""
    persist="screenX screenY width height"
    width="600"
    height="760"
    windowtype="tidy-up:collections-dialog"
    onload="onLoad();">
    <script type="application/javascript" src="chrome://tidy-up-trae/content/l10n.js"/>
    <script type="application/javascript" src="chrome://tidy-up-trae/content/icons.js"/>
    <script type="application/javascript" src="chrome://tidy-up-trae/content/collectionsDialog.js"/>

    <html:div id="app">
        <html:div id="header">
            <html:div id="item-label"></html:div>
            <html:div id="item-name"></html:div>
        </html:div>

        <html:div id="toolbar">
            <html:input id="search" type="search" />
            <html:span id="search-status"></html:span>
            <html:button id="btn-retry" class="pr" type="button"></html:button>
        </html:div>

        <html:div id="controls">
            <html:label>
                <html:span id="thr-label"></html:span>
                <html:input id="thr" type="range" min="0" max="100" step="1" value="70" />
                <html:span id="thr-val">70%</html:span>
            </html:label>
            <html:label><html:input id="hide-zero" type="checkbox" /><html:span id="hide-zero-label"></html:span></html:label>
            <html:span class="spacer"></html:span>
            <html:button id="btn-expand" class="pr" type="button"></html:button>
            <html:button id="btn-collapse" class="pr" type="button"></html:button>
            <html:button id="btn-clear" class="pr" type="button"></html:button>
        </html:div>

        <html:div id="scroll"></html:div>

        <html:div id="footer">
            <html:span id="count"></html:span>
            <html:span id="tip"></html:span>
            <html:button id="btn-cancel" class="pr" type="button"></html:button>
            <html:button id="btn-ok" class="pr primary" type="button"></html:button>
        </html:div>
    </html:div>
</window>
