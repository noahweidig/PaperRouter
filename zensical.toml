[project]
site_name = "PaperRouter"
site_description = "Rank the Zotero collections each paper belongs to, offline or with an LLM, and file a whole batch in one go."
site_author = "Noah Weidig"
site_url = "https://noahweidig.com/PaperRouter/"
repo_url = "https://github.com/noahweidig/PaperRouter"
repo_name = "noahweidig/PaperRouter"
copyright = "PaperRouter is free and open source. MPL-2.0."
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Use it" = "usage.md" },
  { "Batch mode and undo" = "batch.md" },
  { "How it works" = "how-it-works.md" },
  { "Providers" = "providers.md" },
  { "Settings" = "settings.md" },
  { "Privacy" = "privacy.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Credits and licenses" = "about.md" },
  { "Tags" = "tags.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
favicon = "favicon.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/folder-down"
repo = "octicons/mark-github-16"

[project.theme.icon.tag]
default = "lucide/hash"
ranking = "lucide/list-ordered"
batch = "lucide/layers"
undo = "lucide/undo-2"
settings = "lucide/settings"
privacy = "lucide/lock"
providers = "lucide/plug"
help = "lucide/life-buoy"
legal = "lucide/scale"
start = "lucide/rocket"
zotero = "lucide/library-big"
internals = "lucide/workflow"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.tags]

[project.extra.tags]
"Ranking" = "ranking"
"Batch" = "batch"
"Undo" = "undo"
"Settings" = "settings"
"Privacy" = "privacy"
"Providers" = "providers"
"Help" = "help"
"Legal" = "legal"
"Getting started" = "start"
"Zotero" = "zotero"
"Internals" = "internals"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
